name: Android build

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      # No keystore generation here any more. CI used to mint a fresh key on every run,
      # which signed each APK differently and made "install over the previous build" fail with
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE — forcing an uninstall that wiped saved settings.
      # The committed keystore in android/app/ is used instead; see app/build.gradle.kts.
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk

      # A GitHub Release asset downloads as a raw .apk (unlike a zipped Actions artifact),
      # which is what lets a phone browser install it directly with no unzip step.
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Hands-Free Gestures (latest build)
          body: |
            Auto-built from the latest `main`. Two APKs are attached — try `app-release.apk`
            first (some phones, e.g. ColorOS/Realme UI and MIUI, block the debug-signed one):

            - `app-release.apk` — signed with a stable release key, so each build installs
              over the previous one and your settings survive. Recommended.
            - `app-debug.apk` — standard debug build, for comparison/debugging.

            Download on your phone and open it to install (enable "install unknown apps"
            for your browser/file manager when prompted).

            Builds published before 2026-08-23 were each signed with a different throwaway key,
            so upgrading from one of those needs a one-time uninstall first. Every build from
            then on installs straight over the top.
          prerelease: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
