name: Android build

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Generate release signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias handsfree -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" -keypass "$RELEASE_KEY_PASSWORD" \
            -dname "CN=Hands-Free Gestures, OU=Dev, O=Ai-motion-option, C=IN"
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ github.run_id }}handsfree
          RELEASE_KEY_PASSWORD: ${{ github.run_id }}handsfree

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ github.run_id }}handsfree
          RELEASE_KEY_ALIAS: handsfree
          RELEASE_KEY_PASSWORD: ${{ github.run_id }}handsfree

      - uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk

      # A GitHub Release asset downloads as a raw .apk (unlike a zipped Actions artifact),
      # which is what lets a phone browser install it directly with no unzip step.
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Hands-Free Gestures (latest build)
          body: |
            Auto-built from the latest `main`. Two APKs are attached — try `app-release.apk`
            first (some phones, e.g. ColorOS/Realme UI and MIUI, block the debug-signed one):

            - `app-release.apk` — signed with a real (non-debug) key, generated fresh on
              every build. Recommended.
            - `app-debug.apk` — standard debug build, for comparison/debugging.

            Download on your phone and open it to install (enable "install unknown apps"
            for your browser/file manager when prompted).
          prerelease: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
