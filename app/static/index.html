<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ai-motion-option — hands-free demo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #0b0c10; color: #e8e8ec;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); /* mirror front camera */
  }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    justify-content: space-between; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    pointer-events: none;
  }
  #status {
    align-self: flex-start; background: rgba(0,0,0,0.55); border-radius: 999px;
    padding: 6px 14px; font-size: 13px; letter-spacing: 0.02em;
  }
  #status.ok { color: #6fe08a; }
  #status.warn { color: #f2c94c; }
  #status.err { color: #f26c6c; }
  #result {
    text-align: center; padding-bottom: 8vh;
  }
  #gesture {
    font-size: clamp(28px, 9vw, 56px); font-weight: 700; text-transform: capitalize;
    text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  }
  #action {
    margin-top: 6px; font-size: clamp(16px, 5vw, 24px); color: #8ab4ff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  }
  #hint {
    margin-top: 10px; font-size: 13px; color: #9a9aa2;
    text-shadow: 0 1px 6px rgba(0,0,0,0.8);
  }
  #controls {
    display: flex; justify-content: center; gap: 12px; pointer-events: auto;
  }
  button {
    background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px; padding: 10px 18px; font-size: 14px; backdrop-filter: blur(6px);
  }
  #start {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0b0c10; z-index: 10;
  }
  #start button {
    font-size: 18px; padding: 16px 32px; background: #3d6bff; border: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none"></canvas>
  <div id="overlay">
    <div id="status" class="warn">idle</div>
    <div id="result">
      <div id="gesture">—</div>
      <div id="action">&nbsp;</div>
      <div id="hint">Show open palm / fist / thumbs up / thumbs down / point / peace</div>
      <div id="controls" style="margin-top:16px">
        <button id="flip">Flip camera</button>
      </div>
    </div>
  </div>
  <div id="start">
    <button id="beginBtn">Enable camera &amp; start</button>
  </div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const gestureEl = document.getElementById('gesture');
const actionEl = document.getElementById('action');
const startScreen = document.getElementById('start');
const flipBtn = document.getElementById('flip');

let facingMode = 'user';
let ws = null;
let sending = false;
let stream = null;
const SEND_INTERVAL_MS = 200; // ~5 fps, plenty for gesture control

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls;
}

async function startCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode, width: { ideal: 480 }, height: { ideal: 360 } },
    audio: false,
  });
  video.srcObject = stream;
  video.style.transform = facingMode === 'user' ? 'scaleX(-1)' : 'none';
  await video.play();
}

function connectSocket() {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${scheme}://${location.host}/ws/motion`);

  ws.onopen = () => {
    setStatus('connected', 'ok');
    loop();
  };
  ws.onclose = () => {
    setStatus('disconnected — retrying…', 'err');
    setTimeout(connectSocket, 1500);
  };
  ws.onerror = () => setStatus('connection error', 'err');

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.error) {
      setStatus(data.error, 'warn');
      return;
    }
    const hands = data.hands || [];
    if (hands.length === 0) {
      gestureEl.textContent = 'no hand detected';
      actionEl.textContent = ' ';
      return;
    }
    const best = hands.reduce((a, b) => (b.confidence > a.confidence ? b : a));
    gestureEl.textContent = best.gesture.replace('_', ' ');
    actionEl.textContent = best.action ? `→ ${best.action}` : ' ';
  };
}

function loop() {
  if (!ws || ws.readyState !== WebSocket.OPEN || sending) return;
  if (video.videoWidth === 0) {
    setTimeout(loop, SEND_INTERVAL_MS);
    return;
  }
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob((blob) => {
    if (!blob) return;
    sending = true;
    const reader = new FileReader();
    reader.onloadend = () => {
      const base64 = reader.result.split(',')[1];
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(base64);
      sending = false;
    };
    reader.readAsDataURL(blob);
  }, 'image/jpeg', 0.6);
  setTimeout(loop, SEND_INTERVAL_MS);
}

document.getElementById('beginBtn').addEventListener('click', async () => {
  try {
    setStatus('requesting camera…', 'warn');
    await startCamera();
    startScreen.style.display = 'none';
    connectSocket();
  } catch (err) {
    setStatus('camera error: ' + err.message, 'err');
  }
});

flipBtn.addEventListener('click', async () => {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  try {
    await startCamera();
  } catch (err) {
    setStatus('camera error: ' + err.message, 'err');
  }
});
</script>
</body>
</html>
